spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1s
      connect-timeout: 2s
  application:
    name: timeflow-api
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3307/timeflow?serverTimezone=Asia/Seoul&characterEncoding=utf8
    username: timeflow
    password: timeflow9661
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never

logging:
  config: classpath:log4j2.xml
  level:
    root: INFO
    org.springframework.security: WARN

app:
  chat:
    enabled: ${CHAT_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost,capacitor://localhost}
  security:
    jwt:
      issuer: ${JWT_ISSUER:timeflow}
      secret: ${JWT_SECRET:}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
  ai:
    provider: ${AI_PROVIDER:}
    api-key: ${AI_API_KEY:}
    model-name: ${AI_MODEL:}

springdoc:
  packages-to-scan: kr.timebar.diary
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs.path: /v3/api-docs
