name: timeflow
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: timeflow
      MYSQL_USER: timeflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in infra/deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u timeflow -D timeflow -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    image: ${REGISTRY_IMAGE:?Set REGISTRY_IMAGE}/api:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/timeflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_SCHEMA: timeflow
      DB_USERNAME: timeflow
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random 32-byte minimum value}
      CHAT_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: ${APP_ORIGIN:-http://localhost:8088}
      MAIL_HEALTH_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    mem_limit: 1g

  web:
    image: ${REGISTRY_IMAGE:?Set REGISTRY_IMAGE}/web:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${WEB_PORT:-8088}:80
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
