stages: [build, verify, package, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

include:
  - local: .gitlab/ci/linux.yml

build_pages:
  stage: build
  image: node:22-alpine
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm/]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline --no-audit
    - npm run build:pages
    - node --test --test-concurrency=1 tests/*.test.mjs
    - cd ..
    - node frontend/scripts/api-inventory.mjs --check
    - node frontend/scripts/design-docs/build.mjs . --api-only --check
    - node frontend/scripts/audit-api-docs.mjs --check --date=2026-10-03
  artifacts:
    paths: [frontend/dist/]
    expire_in: 7 days

pages:
  stage: deploy
  image: alpine:3.21
  needs:
    - job: build_pages
      artifacts: true
  script:
    - mkdir -p public
    - cp -a frontend/dist/. public/
    - test -s public/index.html
  pages:
    publish: public
  artifacts:
    paths: [public/]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
